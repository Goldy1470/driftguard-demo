openapi: 3.0.1
info:
  title: Orders API
  version: "1.0.0"
servers:
  - url: https://api.example.com
paths:
  /orders:
    post:
      responses:
        "200":
          description: ok
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
components:
  schemas:
    OrderInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
